<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gradient text fixture</title>
    <style>
      body { margin: 0; padding: 16px; background: #ffffff; color: #1a1a1a; font-family: system-ui, sans-serif; }
      h1 {
        margin: 0;
        color: #1a1a1a;
        background-image: linear-gradient(90deg, #1a1a1a, #0055ff);
        -webkit-background-clip: text;
        background-clip: text;
      }
    </style>
  </head>
  <body>
    <h1>Gradient clipped text</h1>
  </body>
</html>
