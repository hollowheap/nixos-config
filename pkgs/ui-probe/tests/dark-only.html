<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dark only</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #ffffff;
        color: #ffffff;
        font-family: system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #000000;
          color: #ffffff;
        }
      }
    </style>
  </head>
  <body>
    <p>This page only defines dark surfaces.</p>
  </body>
</html>
